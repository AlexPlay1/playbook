- name: Setup hostname
  ansible.builtin.import_tasks: .hostname.yml

- name: Setup admin user
  ansible.builtin.import_tasks: .users.yml

- name: Setup sysctl
  ansible.builtin.import_tasks: .sysctl.yml

- name: Setup apt (Debian)
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.import_tasks: .apt.yml

- name: Setup dnf (RHEL)
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.import_tasks: .dnf.yml

- name: Setup unattended-upgrades (Debian)
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.import_tasks: .unattended-upgrades.yml

- name: Setup dnf-automatic (RHEL)
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.import_tasks: .dnf-automatic.yml

# - name: Setup network
#   ansible.builtin.import_tasks: .network.yml

- name: Setup NTP time sync
  ansible.builtin.import_tasks: .ntp.yml

- name: Setup firewall (Debian)
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.import_tasks: .firewall.debian.yml

- name: Setup firewall (RHEL)
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.import_tasks: .firewall.rhel.yml

# - name: Setup MTA
#   ansible.builtin.import_tasks: .mail.yml

- name: Setup zsh
  ansible.builtin.import_tasks: .zsh.yml

- name: Setup bash
  ansible.builtin.import_tasks: .bash.yml

- name: Setup sshd
  ansible.builtin.import_tasks: .sshd.yml

# Daily reboot
- name: Schedule daily reboot at 03:00
  ansible.builtin.cron:
    name: Daily reboot
    hour: "3"
    minute: "0"
    user: root
    job: /sbin/reboot
